name: Phone3DUIStudio
options:
  bundleIdPrefix: com.phone3dui
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: R26X7B8XDT
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 152.0.0
targets:
  Phone3DUIStudio:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Phone 3D Studio
        CFBundleURLTypes:
          - CFBundleURLName: com.phone3dui.studio.pairing
            CFBundleURLSchemes:
              - phone3dstudio
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connects directly to your Mac to stream the live screen and device pose.
        NSMotionUsageDescription: Uses device motion to drive the matching 3D phone pose on your Mac.
        NSCameraUsageDescription: Scans the Mac pairing code and tracks your phone position in space. Camera images stay on this device and are not streamed or saved.
        NSScreenCaptureUsageDescription: Streams your selected iPhone display directly to your Mac for the live 3D preview.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - screen-capture
        LiveBridgeURL: ws://forge.local:4319/?role=phone
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone3dui.studio
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: ARKit.framework
      - package: WebRTC
  Phone3DStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phone3dui.studio.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Phone3DUIStudio
    dependencies:
      - target: Phone3DUIStudio
schemes:
  Phone3DUIStudio:
    build:
      targets:
        Phone3DUIStudio: all
    test:
      targets:
        - Phone3DStudioUITests
